<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ironclad Home Services</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0b;
    color: #eceeef;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .hero { max-width: 560px; }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #f2f2f0;
  }
  .hero p {
    margin-top: 14px;
    font-size: 1rem;
    color: #9a9ea3;
    line-height: 1.6;
  }
  .accent { color: #c9974c; }
</style>
</head>
<body>
  <div class="hero">
    <h1>Ironclad <span class="accent">Home Services</span></h1>
    <p>Plumbing, HVAC, excavation, electrical, and handyman work, done right. Chat with us in the corner to get started.</p>
  </div>

  <script
    src="/widget.js"
    data-api="/api/chat"
    data-company="Ironclad Home Services"
    data-tagline="Plumbing, HVAC, Excavation, Electrical, Handyman"
    data-bot-name="Nova"
    data-phone="(555) 010-2030"
    data-accent="#c9974c">
  </script>
</body>
</html>
