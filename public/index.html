<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradePro</title>
  <!-- Include Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    /* Global reset */
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0d0d17;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .demo-page {
      text-align: center;
      padding: 2rem;
    }
    .demo-page h1 {
      font-size: 2.5rem;
      font-weight: 600;
      background: linear-gradient(135deg, #9f9fdf, #6b6b9f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .demo-page p {
      color: #8888aa;
      max-width: 500px;
      margin: 1rem auto;
    }
  </style>
</head>
<body>
  <div class="demo-page">
    <h1>TradePro Services</h1>
    <p>Plumbing · HVAC · Excavation · Electrical · Handyman</p>
    <p style="font-size:0.9rem; color:#555;">Click the chat bubble in the bottom‑right corner.</p>
  </div>

  <!-- The widget will be injected by widget.js -->
  <script src="/widget.js"></script>
</body>
</html>
