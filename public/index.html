<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Trades AI</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0b1120, #1a2a4a);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    .hero {
      text-align: center;
      padding: 20px;
    }
    .hero h1 {
      font-size: 3rem;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .hero p {
      font-size: 1.2rem;
      color: #94a3b8;
      max-width: 500px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>⚡ Summit Trades AI</h1>
    <p>Your smart assistant for plumbing, HVAC, excavation &amp; more – tap the chat bubble to get started.</p>
  </div>
  <script src="/widget.js"></script>
</body>
</html>
